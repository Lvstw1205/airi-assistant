<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIRI · 세계 시장 분석</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#0a1522;color:#e6eef8}body{max-width:1240px;margin:auto;padding:28px}a{color:#75d4d5}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:30px}h2{font-size:20px}button,select,input{font:inherit;background:#182d43;color:inherit;border:1px solid #426078;border-radius:8px;padding:10px;margin:4px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.panel{background:#102236;border:1px solid #29425b;border-radius:14px;padding:18px;margin:16px 0}.muted,small{color:#b0c2d5}.warning{color:#ffcd83;white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #304359}th{color:#85cdd3}td button{font-size:14px}#table{overflow:auto}.up{color:#72d3ba}.down{color:#ffacac}details{padding:10px 0}summary{cursor:pointer}#error{color:#ffbb9b}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px system-ui}nav{display:flex;flex-wrap:wrap}label{display:inline-block}section[hidden]{display:none} @media(max-width:700px){body{padding:12px}header{display:block}.optional{display:none}td,th{padding:8px;font-size:13px}}
</style><script src="/investment.js" defer></script></head><body><header><div><small>AIRI INVESTMENT INTELLIGENCE · 읽기 전용</small><h1>세계 시장, 근거부터 판단까지</h1></div><a href="/">AIRI로 돌아가기</a></header>
<p class="muted">관측·계산·해석·조건부 전망을 구분해. 실시간 체결 시세나 매매 주문 화면이 아니야.</p>
<nav><label>자료 모드 <select id="mode"><option value="live">실제 데이터</option><option value="fixture">FIXTURE · 합성 예제</option></select></label><button id="refresh">세계 시장 분석 생성</button><button id="reload">상태 새로고침</button></nav>
<p id="error" role="alert"></p><p id="status" aria-live="polite">저장된 자료 확인 중…</p><section class="panel"><h2>시장 개요</h2><p id="basis"></p><div id="summary" class="grid"></div><nav><select id="asset" aria-label="자산 유형"><option value="">모든 자산</option><option value="index">주가지수</option><option value="equity">개별 종목</option><option value="fx">환율</option><option value="rates">금리</option><option value="commodity">원자재</option><option value="crypto">암호자산</option></select><select id="region" aria-label="지역"><option value="">모든 지역</option><option>미국</option><option>캐나다</option><option>한국</option><option>일본</option><option>중국/홍콩</option><option>유럽</option><option>글로벌</option></select><input id="search" placeholder="종목명·티커·거래소 검색" aria-label="종목 검색"></nav><div id="table"></div><div id="catalog"></div></section>
<section id="detail" class="panel" hidden><h2 id="detail-title"></h2><div id="detail-body"></div><button id="analyze">선택 종목 한국어 보고서 생성</button><button id="watch">관심 목록에 추가</button><button id="fundamentals">기업 재무 심화 분석</button></section>
<section class="panel"><h2>검증된 보고서</h2><div id="report"></div></section><section class="panel"><h2>경제 일정 · 확인할 사항</h2><div id="calendar"></div></section><details class="panel"><summary>지원 범위·데이터 제한·운영 상태</summary><div id="coverage"></div></details></body></html>
